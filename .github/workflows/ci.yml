name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ChaosChess.AI.sln

      - name: Build
        run: dotnet build ChaosChess.AI.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ChaosChess.AI.sln --configuration Release --no-build --verbosity normal

      - name: Package Unity artifact dry-run
        shell: pwsh
        run: ./scripts/package-unity.ps1 -Version 0.1.0 -CommitSha ${{ github.sha }} -OutputRoot ./artifacts/release -NoBuild

      - name: Upload Unity package dry-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaoschess-ai-unity-package-dry-run
          path: |
            artifacts/release/ChaosChess.AI-v0.1.0-unity.zip
            artifacts/release/ChaosChess.AI-v0.1.0-unity/manifest.json
            artifacts/release/ChaosChess.AI-v0.1.0-unity/SHA256SUMS.txt
