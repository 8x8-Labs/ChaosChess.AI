name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ChaosChess.AI.sln

      - name: Build
        run: dotnet build ChaosChess.AI.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ChaosChess.AI.sln --configuration Release --no-build --verbosity normal
